<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d">
<title id="t">Les trois contrôles du SPANC</title>
<desc id="d">1. Conception : avant les travaux, le SPANC examine le projet et rend un avis, obligatoire avant de commencer. 2. Bonne exécution : pendant le chantier, il vérifie l'installation avant remblaiement. 3. Fonctionnement et entretien : contrôle périodique au maximum tous les 10 ans.</desc>
<rect width="720" height="300" rx="18" fill="#f5fafb"/>
<text x="30" y="44" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1b2b33">Les trois contrôles du SPANC</text>
<line x1="120" y1="110" x2="600" y2="110" stroke="#0e7c86" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
<circle cx="120" cy="110" r="30" fill="#fff" stroke="#0e7c86" stroke-width="4"/><text x="120" y="121" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#0e7c86" text-anchor="middle">1</text>
<rect x="15" y="160" width="210" height="112" rx="14" fill="#fff" stroke="#cfe5e7" stroke-width="2"/>
<text x="120" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1b2b33" text-anchor="middle">La conception</text>
<text x="120" y="214" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#0e7c86" text-anchor="middle">Avant les travaux</text>
<text x="120" y="240" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3d525c" text-anchor="middle">Avis favorable obligatoire</text>
<text x="120" y="258" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3d525c" text-anchor="middle">avant de commencer</text>
<circle cx="360" cy="110" r="30" fill="#fff" stroke="#0e7c86" stroke-width="4"/><text x="360" y="121" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#0e7c86" text-anchor="middle">2</text>
<rect x="255" y="160" width="210" height="112" rx="14" fill="#fff" stroke="#cfe5e7" stroke-width="2"/>
<text x="360" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1b2b33" text-anchor="middle">La bonne exécution</text>
<text x="360" y="214" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#0e7c86" text-anchor="middle">Pendant le chantier</text>
<text x="360" y="240" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3d525c" text-anchor="middle">Visite avant remblaiement :</text>
<text x="360" y="258" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3d525c" text-anchor="middle">prévenir le SPANC à l'avance</text>
<circle cx="600" cy="110" r="30" fill="#fff" stroke="#0e7c86" stroke-width="4"/><text x="600" y="121" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#0e7c86" text-anchor="middle">3</text>
<rect x="495" y="160" width="210" height="112" rx="14" fill="#fff" stroke="#cfe5e7" stroke-width="2"/>
<text x="600" y="190" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1b2b33" text-anchor="middle">Le fonctionnement</text>
<text x="600" y="214" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#0e7c86" text-anchor="middle">Après la mise en service</text>
<text x="600" y="240" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3d525c" text-anchor="middle">Contrôle périodique,</text>
<text x="600" y="258" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3d525c" text-anchor="middle">au maximum tous les 10 ans</text>
</svg>
