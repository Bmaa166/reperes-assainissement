<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">Mise aux normes de l’assainissement : les étapes dans l’ordre</title>
<desc id="d">1. Étude de sol et de filière par un bureau d’études, 350 à 800 €. 2. Dossier de conception au SPANC : avis favorable obligatoire, redevance d’environ 60 à 175 €. 3. Devis de plusieurs entreprises sur la même base, agrément du dispositif vérifié. 4. Travaux : prévenir le SPANC à l’avance pour sa visite. 5. Contrôle de bonne exécution avant remblaiement, environ 90 à 190 €. 6. Entretien : vidanges au seuil, puis contrôle du SPANC au plus tous les 10 ans. Jamais de travaux avant l’avis favorable du SPANC ; après un achat avec un rapport non conforme, tout doit tenir dans un an.</desc>
<defs><clipPath id="c"><rect width="720" height="400" rx="18"/></clipPath></defs>
<g clip-path="url(#c)" font-family="Arial,Helvetica,sans-serif">
<rect width="720" height="400" fill="#f5fafb"/>
<text x="30" y="42" font-size="22" font-weight="700" fill="#13232b">Mise aux normes : les étapes dans l’ordre</text>
<rect x="24" y="60" width="212" height="124" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<circle cx="56" cy="92" r="18" fill="#fff" stroke="#0e7c86" stroke-width="3"/><text x="56" y="98.48" font-size="18" font-weight="700" fill="#0e7c86" text-anchor="middle">1</text>
<text x="84" y="98" font-size="15" font-weight="700" fill="#13232b">Étude de sol</text>
<text x="42" y="130" font-size="13" fill="#3d525c">Étude de sol et de filière</text>
<text x="42" y="148" font-size="13" fill="#3d525c">par un bureau d’études</text>
<text x="42" y="170" font-size="14" font-weight="700" fill="#0e7c86">350 à 800 €</text>
<rect x="254" y="60" width="212" height="124" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<circle cx="286" cy="92" r="18" fill="#fff" stroke="#0e7c86" stroke-width="3"/><text x="286" y="98.48" font-size="18" font-weight="700" fill="#0e7c86" text-anchor="middle">2</text>
<text x="314" y="98" font-size="15" font-weight="700" fill="#13232b">Avis du SPANC</text>
<text x="272" y="130" font-size="13" fill="#3d525c">Dossier de conception :</text>
<text x="272" y="148" font-size="13" fill="#3d525c">avis favorable obligatoire</text>
<text x="272" y="170" font-size="14" font-weight="700" fill="#0e7c86">environ 60 à 175 €</text>
<rect x="484" y="60" width="212" height="124" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<circle cx="516" cy="92" r="18" fill="#fff" stroke="#0e7c86" stroke-width="3"/><text x="516" y="98.48" font-size="18" font-weight="700" fill="#0e7c86" text-anchor="middle">3</text>
<text x="544" y="98" font-size="15" font-weight="700" fill="#13232b">Devis</text>
<text x="502" y="130" font-size="13" fill="#3d525c">Plusieurs entreprises,</text>
<text x="502" y="148" font-size="13" fill="#3d525c">sur la même base,</text>
<text x="502" y="166" font-size="13" fill="#3d525c">agrément vérifié</text>
<rect x="24" y="196" width="212" height="124" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<circle cx="56" cy="228" r="18" fill="#fff" stroke="#0e7c86" stroke-width="3"/><text x="56" y="234.48" font-size="18" font-weight="700" fill="#0e7c86" text-anchor="middle">4</text>
<text x="84" y="234" font-size="15" font-weight="700" fill="#13232b">Travaux</text>
<text x="42" y="266" font-size="13" fill="#3d525c">Prévenir le SPANC</text>
<text x="42" y="284" font-size="13" fill="#3d525c">à l’avance pour sa visite</text>
<rect x="254" y="196" width="212" height="124" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<circle cx="286" cy="228" r="18" fill="#fff" stroke="#0e7c86" stroke-width="3"/><text x="286" y="234.48" font-size="18" font-weight="700" fill="#0e7c86" text-anchor="middle">5</text>
<text x="314" y="234" font-size="15" font-weight="700" fill="#13232b">Contrôle du SPANC</text>
<text x="272" y="266" font-size="13" fill="#3d525c">Bonne exécution,</text>
<text x="272" y="284" font-size="13" fill="#3d525c">avant remblaiement</text>
<text x="272" y="306" font-size="14" font-weight="700" fill="#0e7c86">environ 90 à 190 €</text>
<rect x="484" y="196" width="212" height="124" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<circle cx="516" cy="228" r="18" fill="#fff" stroke="#0e7c86" stroke-width="3"/><text x="516" y="234.48" font-size="18" font-weight="700" fill="#0e7c86" text-anchor="middle">6</text>
<text x="544" y="234" font-size="15" font-weight="700" fill="#13232b">Entretien</text>
<text x="502" y="266" font-size="13" fill="#3d525c">Vidanges au seuil, puis</text>
<text x="502" y="284" font-size="13" fill="#3d525c">contrôle du SPANC</text>
<text x="502" y="306" font-size="14" font-weight="700" fill="#0e7c86">au plus tous les 10 ans</text>
<path d="M236 115 L244 122 L236 129" fill="none" stroke="#14a3a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M236 251 L244 258 L236 265" fill="none" stroke="#14a3a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M466 115 L474 122 L466 129" fill="none" stroke="#14a3a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M466 251 L474 258 L466 265" fill="none" stroke="#14a3a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24" y="336" width="672" height="54" rx="12" fill="#fff4e3" stroke="#f2a516" stroke-width="2"/>
<text x="44" y="359" font-size="14" font-weight="700" fill="#b5600b">Jamais de travaux avant l’avis favorable du SPANC</text>
<text x="44" y="379" font-size="13.5" fill="#13232b">Après un achat avec un rapport non conforme : tout doit tenir dans un an</text>
</g>
</svg>
