<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="t d">
<title id="t">Prix d'un assainissement individuel par filière (2026)</title><desc id="d">Fourchettes de prix TTC posé pour une maison de 4 à 5 équivalents-habitants : fosse toutes eaux et épandage 5 000 à 10 000 €, micro-station 8 000 à 11 000 €, filtre compact 8 000 à 12 000 €, fosse et filtre à sable 9 000 à 10 000 €, filtre planté de roseaux 8 000 à 14 000 €.</desc>
<rect width="720" height="350" rx="18" fill="#f5fafb"/>
<text x="30" y="42" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1b2b33">Prix d'un assainissement individuel par filière (2026)</text>
<line x1="230.0" y1="62" x2="230.0" y2="290" stroke="#d6e2e6" stroke-width="1"/>
<text x="230.0" y="312" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#4a5d66" text-anchor="middle">0</text>
<line x1="383.3" y1="62" x2="383.3" y2="290" stroke="#d6e2e6" stroke-width="1"/>
<text x="383.3" y="312" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#4a5d66" text-anchor="middle">5 k€</text>
<line x1="536.7" y1="62" x2="536.7" y2="290" stroke="#d6e2e6" stroke-width="1"/>
<text x="536.7" y="312" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#4a5d66" text-anchor="middle">10 k€</text>
<line x1="690.0" y1="62" x2="690.0" y2="290" stroke="#d6e2e6" stroke-width="1"/>
<text x="690.0" y="312" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#4a5d66" text-anchor="middle">15 k€</text>
<text x="216" y="92" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1b2b33" text-anchor="end">Fosse + épandage</text>
<rect x="383.3" y="76" width="153.3" height="24" rx="12" fill="#dff3f3" stroke="#0e7c86" stroke-width="2"/>
<text x="460.0" y="93" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#0e7c86" text-anchor="middle">5–10 k€</text>
<text x="216" y="136" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1b2b33" text-anchor="end">Micro-station</text>
<rect x="475.3" y="120" width="92.0" height="24" rx="12" fill="#dff3f3" stroke="#0e7c86" stroke-width="2"/>
<text x="521.3" y="137" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#0e7c86" text-anchor="middle">8–11 k€</text>
<text x="216" y="180" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1b2b33" text-anchor="end">Filtre compact</text>
<rect x="475.3" y="164" width="122.7" height="24" rx="12" fill="#dff3f3" stroke="#0e7c86" stroke-width="2"/>
<text x="536.7" y="181" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#0e7c86" text-anchor="middle">8–12 k€</text>
<text x="216" y="224" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1b2b33" text-anchor="end">Fosse + filtre à sable</text>
<rect x="506.0" y="208" width="30.7" height="24" rx="12" fill="#dff3f3" stroke="#0e7c86" stroke-width="2"/>
<text x="544.7" y="225" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#0e7c86" text-anchor="start">9–10 k€</text>
<text x="216" y="268" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1b2b33" text-anchor="end">Filtre planté de roseaux</text>
<rect x="475.3" y="252" width="184.0" height="24" rx="12" fill="#dff3f3" stroke="#0e7c86" stroke-width="2"/>
<text x="567.3" y="269" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#0e7c86" text-anchor="middle">8–14 k€</text>
<text x="30" y="336" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#4a5d66">Fourchettes 2026 TTC, pose comprise. Sources en bas de page.</text>
