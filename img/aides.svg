<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d">
<title id="t">Les aides à l’assainissement individuel en 2026</title>
<desc id="d">Éco-PTZ : jusqu’à 10 000 € sur 15 ans, sans intérêts et sans condition de ressources, hors micro-station. TVA à 10 % dans un logement de plus de 2 ans pour l’installation, la mise aux normes et la vidange. Intercommunalités : 17 SPANC vendéens avec une aide locale en 2025, à conditions variables. Plus d’aide pour les particuliers de l’agence de l’eau (12e programme 2025-2030), de Vendée Eau ni des Départements 44 et 85 ; MaPrimeRénov’ ne finance pas l’assainissement.</desc>
<defs><clipPath id="c"><rect width="720" height="380" rx="18"/></clipPath></defs>
<g clip-path="url(#c)" font-family="Arial,Helvetica,sans-serif">
<rect width="720" height="380" fill="#f5fafb"/>
<text x="30" y="42" font-size="21" font-weight="700" fill="#13232b">Les aides à l’assainissement individuel en 2026</text>
<rect x="24" y="60" width="212" height="206" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<path d="M24 74 Q24 60 38 60 H222 Q236 60 236 74 V98 H24 Z" fill="#e6f6f6"/>
<text x="130" y="85" font-size="15" font-weight="700" fill="#0e7c86" text-anchor="middle">Éco-PTZ</text>
<text x="130" y="140" font-size="28" font-weight="700" fill="#0e7c86" text-anchor="middle">10 000 €</text>
<text x="130" y="172" font-size="13" fill="#3d525c" text-anchor="middle">maximum, sur 15 ans</text>
<text x="130" y="192" font-size="13" fill="#3d525c" text-anchor="middle">sans intérêts</text>
<text x="130" y="212" font-size="13" fill="#3d525c" text-anchor="middle">sans condition de ressources</text>
<text x="130" y="232" font-size="13" fill="#3d525c" text-anchor="middle">hors micro-station</text>
<rect x="254" y="60" width="212" height="206" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<path d="M254 74 Q254 60 268 60 H452 Q466 60 466 74 V98 H254 Z" fill="#e6f6f6"/>
<text x="360" y="85" font-size="15" font-weight="700" fill="#0e7c86" text-anchor="middle">TVA réduite</text>
<text x="360" y="140" font-size="28" font-weight="700" fill="#0e7c86" text-anchor="middle">10 %</text>
<text x="360" y="172" font-size="13" fill="#3d525c" text-anchor="middle">dans un logement</text>
<text x="360" y="192" font-size="13" fill="#3d525c" text-anchor="middle">de plus de 2 ans</text>
<text x="360" y="212" font-size="13" fill="#3d525c" text-anchor="middle">installation, mise aux</text>
<text x="360" y="232" font-size="13" fill="#3d525c" text-anchor="middle">normes et vidange</text>
<rect x="484" y="60" width="212" height="206" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<path d="M484 74 Q484 60 498 60 H682 Q696 60 696 74 V98 H484 Z" fill="#e6f6f6"/>
<text x="590" y="85" font-size="15" font-weight="700" fill="#0e7c86" text-anchor="middle">Intercommunalités</text>
<text x="590" y="140" font-size="28" font-weight="700" fill="#0e7c86" text-anchor="middle">17</text>
<text x="590" y="172" font-size="13" fill="#3d525c" text-anchor="middle">SPANC vendéens avec</text>
<text x="590" y="192" font-size="13" fill="#3d525c" text-anchor="middle">une aide locale en 2025</text>
<text x="590" y="212" font-size="13" fill="#3d525c" text-anchor="middle">conditions variables :</text>
<text x="590" y="232" font-size="13" fill="#3d525c" text-anchor="middle">vérifiez avant le devis</text>
<rect x="24" y="280" width="672" height="84" rx="12" fill="#fff4e3" stroke="#f2a516" stroke-width="2"/>
<text x="44" y="305" font-size="14.5" font-weight="700" fill="#b5600b">Plus d’aide pour les particuliers</text>
<text x="44" y="329" font-size="13.5" fill="#13232b">Agence de l’eau (12e programme 2025-2030), Vendée Eau, Départements 44 et 85</text>
<text x="44" y="351" font-size="13.5" fill="#13232b">MaPrimeRénov’ : l’assainissement n’en fait pas partie</text>
</g>
</svg>
