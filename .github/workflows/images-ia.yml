name: Illustrations des pages (images avec alt)
# Guide Google IA (juillet 2026) : images utiles et pertinentes, avec un texte alternatif.
# Ajoute des illustrations SVG claires et les insere dans les pages. Idempotent (une page deja illustree est ignoree).
# Se lance seul au push sur la branche images-ia ; ne pousse jamais sur main.
on:
  workflow_dispatch:
  push:
    branches: [images-ia]

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Images et insertion
        run: |
          python3 - <<'PY'
          import base64, json, pathlib
          cfg = json.loads(base64.b64decode(""))
          d = pathlib.Path(cfg["imgdir"]); d.mkdir(parents=True, exist_ok=True)
          for n, b in cfg["files"].items():
              (d / n).write_bytes(base64.b64decode(b)); print("image :", d / n)
          for it in cfg["items"]:
              p = pathlib.Path(it["page"]); t = p.read_text(encoding="utf-8")
              if it["src"] in t:
                  print("deja present :", p); continue
              s = t.find(it["start"]) if it["start"] else 0
              if s < 0: raise SystemExit("repere de depart introuvable : %s" % p)
              i = t.find(it["marker"], s)
              if i < 0: raise SystemExit("repere introuvable : %s" % p)
              if it["mode"] == "after": i += len(it["marker"])
              t = t[:i] + "\n" + it["fig"] + "\n" + t[i:]
              p.write_text(t, encoding="utf-8"); print("page :", p)
          if cfg["css"]:
              c = pathlib.Path(cfg["css"]); ct = c.read_text(encoding="utf-8")
              if ".ill{" not in ct:
                  c.write_text(ct.rstrip() + "\n.ill{margin:28px 0}.ill img{display:block;width:100%;height:auto;border-radius:14px}\n", encoding="utf-8"); print("css :", c)
          PY
      - name: Commit sur la branche (jamais sur main)
        if: github.ref == 'refs/heads/images-ia'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Rien a changer" && exit 0
          git commit -m "Illustrations claires avec texte alternatif (guide Google IA)"
          git push
